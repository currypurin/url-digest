<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Markdown風テキストからURLだけで共有できるニュース一覧ページを作成します。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AIニュース共有" />
    <meta
      property="og:description"
      content="Markdown風テキストからURLだけで共有できるニュース一覧ページを作成します。"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AIニュース共有" />
    <meta
      name="twitter:description"
      content="Markdown風テキストからURLだけで共有できるニュース一覧ページを作成します。"
    />
    <title>AIニュース共有</title>
    <link rel="stylesheet" href="./styles.css?v=20260504-week" />
    <script defer src="./app.js?v=20260504-week"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div>
          <p class="eyebrow">URL Digest</p>
          <h1 id="pageTitle">AIニュース共有</h1>
          <p id="pageDescription" class="page-description">
            Markdown風テキストから、URLだけで共有できるニュース一覧を作れます。
          </p>
        </div>
        <div class="stats" aria-label="ニュース件数">
          <span id="itemCount">0</span>
          <span>items</span>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="creator-panel" aria-labelledby="creatorTitle">
        <div class="panel-heading">
          <div>
            <h2 id="creatorTitle">共有URL作成</h2>
            <p>見出しとURLを貼り付けると、右側にプレビューされます。</p>
          </div>
          <button id="sampleButton" class="ghost-button" type="button">サンプル</button>
        </div>

        <form id="shareForm" class="share-form">
          <label>
            <span>ページタイトル</span>
            <input
              id="titleInput"
              name="title"
              type="text"
              value="AIニュース共有"
              autocomplete="off"
            />
          </label>

          <label>
            <span>説明文</span>
            <input
              id="descriptionInput"
              name="description"
              type="text"
              placeholder="今日気になったニュース"
              autocomplete="off"
            />
          </label>

          <label>
            <span>Markdown風ニュース本文</span>
            <textarea
              id="markdownInput"
              name="markdown"
              rows="16"
              placeholder="# トップニュース&#10;### ニュース項目タイトル&#10;https://x.com/user/status/123&#10;https://example.com/article"
            ></textarea>
          </label>

          <div class="form-actions">
            <button id="renderButton" class="secondary-button" type="button">
              表示を更新
            </button>
            <button class="primary-button" type="submit">共有URLを作成</button>
          </div>
        </form>

        <div class="share-output">
          <label for="shareUrl">生成された共有URL</label>
          <div class="copy-row">
            <input id="shareUrl" type="text" readonly />
            <button id="copyButton" class="secondary-button" type="button" disabled>
              コピー
            </button>
          </div>
          <p id="statusText" class="status-text" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section class="news-view" aria-labelledby="newsTitle">
        <div class="news-heading">
          <div>
            <h2 id="newsTitle">ニュース一覧</h2>
            <p id="sourceNotice">フォーム入力、またはURL内の共有データから表示します。</p>
          </div>
          <a id="newShareLink" class="secondary-button new-share-link" href="./">新しく作る</a>
        </div>
        <div id="newsContainer" class="news-container"></div>
      </section>
    </main>
  </body>
</html>
